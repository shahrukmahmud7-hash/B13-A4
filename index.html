<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Aply Tracker Assignment</title>
     <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Cdn Icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
</head>
<body class="bg-gray-100">
  <div class="max-w-6xl mx-auto p-4 md:p-8">
      <!-- Title -->
      <h1 class="text-2xl font-bold md:text-4xl text-slate-800 mb-6 md:mb-10">
        Job Apply Tracker
      </h1>

      <!-- Cards -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"
      >
        <!--Total  -->
        <div class="bg-white rounded-xl shadow-sm border p-6">
          <p class="text-gray-500 text-lg">Total</p>
          <h2 class="text-4xl font-bold text-slate-800 mt-2" id="total">0</h2>
        </div>

        <!-- Interview -->
        <div class="bg-white rounded-xl shadow-sm border p-6">
          <p class="text-gray-500 text-lg">Interview</p>
          <h2
            class="text-4xl font-bold text-green-600 mt-2"
            id="interviewCount"
          >
            0
          </h2>
        </div>

        <!-- Rejected -->
        <div class="bg-white rounded-xl shadow-sm border p-6">
          <p class="text-gray-500 text-lg">Rejected</p>
          <h2 class="text-4xl font-bold text-red-500 mt-2" id="rejectedCount">
            0
          </h2>
        </div>
      </div>
    </div>
    


</body>
</html>
